name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release copy
        run: |
          mkdir -p build/avdeb-product-embeds
          git archive HEAD | tar -x -C build/avdeb-product-embeds
      # The same checks WordPress.org reviewers run (coding standards, security, readme).
      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: build/avdeb-product-embeds
          slug: avdeb-product-embeds
